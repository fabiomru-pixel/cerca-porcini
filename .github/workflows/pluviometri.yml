name: Pluviometri SIR Toscana

# Riserva: prova a scaricare i pluviometri SIR anche da GitHub. Dal 8/10/2026 il SIR spesso non risponde ai server
# di GitHub (USA): in quel caso il lavoro finisce senza errore (niente email) e resta il file caricato dal PC.
on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - scripts/pluviometri.mjs
      - .github/workflows/pluviometri.yml

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scarica i pluviometri
        id: scarica
        continue-on-error: true
        run: node scripts/pluviometri.mjs
      - name: Salva nel repository
        if: steps.scarica.outcome == 'success'
        run: |
          git config user.name "pluviometri-bot"
          git config user.email "fabiomru-pixel@users.noreply.github.com"
          git add data/pluviometri.json
          git diff --cached --quiet || git commit -m "Pluviometri SIR aggiornati"
          git pull --rebase
          git push
