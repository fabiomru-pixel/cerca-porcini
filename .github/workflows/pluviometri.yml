name: Pluviometri SIR Toscana

# Due volte al giorno scarica i pluviometri SIR in data/pluviometri.json. Dal 8/10/2026 il SIR spesso non risponde ai server
# di GitHub (USA): lo script allora passa dal servizio Cloudflare (SIR_PROXY). Se fallisce comunque, il lavoro
# finisce senza errore (niente email) e resta il file precedente.
on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - scripts/pluviometri.mjs
      - .github/workflows/pluviometri.yml

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scarica i pluviometri
        id: scarica
        continue-on-error: true
        run: node scripts/pluviometri.mjs
        env:
          SIR_PROXY: https://sir-pluviometri.fabio-mru.workers.dev/
      - name: Salva nel repository
        if: steps.scarica.outcome == 'success'
        run: |
          git config user.name "pluviometri-bot"
          git config user.email "fabiomru-pixel@users.noreply.github.com"
          git add data/pluviometri.json
          git diff --cached --quiet || git commit -m "Pluviometri SIR aggiornati"
          git pull --rebase
          git push
